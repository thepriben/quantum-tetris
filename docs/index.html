<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quantum Tetris</title>
  <link rel="stylesheet" href="site.css">
  <link rel="modulepreload" href="boot.js">
  <script src="i18n.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div>
      <h1 data-i18n="home.title">Quantum Tetris</h1>
      <p class="tagline" data-i18n="home.subtitle">Tetris — le hasard vient des circuits</p>
    </div>
    <div class="lang-flags" role="group" aria-label="Langue">
      <button type="button" class="lang-btn" data-lang="fr" data-i18n="lang.fr" data-i18n-attr="title" title="Français" aria-label="Français">
        <svg class="flag" viewBox="0 0 3 2" aria-hidden="true">
          <rect width="1" height="2" fill="#002395"/>
          <rect x="1" width="1" height="2" fill="#fff"/>
          <rect x="2" width="1" height="2" fill="#ed2939"/>
        </svg>
      </button>
      <button type="button" class="lang-btn" data-lang="en" data-i18n="lang.en" data-i18n-attr="title" title="English" aria-label="English">
        <svg class="flag" viewBox="0 0 60 30" aria-hidden="true">
          <clipPath id="uk"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
          <clipPath id="uk-d"><path d="M30,15 h30 v15 z v-15 h-30 z h-30 v15 z v-15 h-30 z"/></clipPath>
          <g clip-path="url(#uk)">
            <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
            <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
            <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#uk-d)" stroke="#C8102E" stroke-width="4"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
          </g>
        </svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <section class="col-game" aria-label="Game">
      <div id="frame">
        <div id="frame-inner">
          <div id="loader">
            <div class="spinner" aria-hidden="true"></div>
            <span id="loader-text" data-i18n="play.starting">Chargement…</span>
          </div>
          <p id="error"></p>
        </div>
      </div>
    </section>

    <section class="col-guide">
      <p class="lead" data-i18n="home.lead" data-i18n-html></p>
      <p class="principle" data-i18n="home.principle" data-i18n-html></p>

      <h2 data-i18n="home.quantumTitle">Mécaniques</h2>
      <ul class="moment-list">
        <li class="moment">
          <h3 data-i18n="home.moment.spawn.title">Nouvelle pièce</h3>
          <p data-i18n="home.moment.spawn.text"></p>
          <div class="circuit-strip circuit-strip--3" aria-hidden="true">
            <img src="circuits/quantum-teleportation-gate-v1.png" alt="" loading="lazy" decoding="async" width="240" height="60">
            <img src="circuits/imp-brain-v1.png" alt="" loading="lazy" decoding="async" width="180" height="50">
            <img src="circuits/enemy-profile-hunter-v1.png" alt="" loading="lazy" decoding="async" width="180" height="50">
          </div>
        </li>
        <li class="moment">
          <h3 data-i18n="home.moment.observe.title">Espace</h3>
          <p data-i18n="home.moment.observe.text"></p>
          <div class="circuit-strip" aria-hidden="true">
            <img src="circuits/observation-pulse-v1.png" alt="" loading="lazy" decoding="async" width="200" height="55">
          </div>
        </li>
        <li class="moment">
          <h3 data-i18n="home.moment.line.title">Ligne complétée</h3>
          <p data-i18n="home.moment.line.text"></p>
          <div class="circuit-strip" aria-hidden="true">
            <img src="circuits/q-shard-stabilizer-v1.png" alt="" loading="lazy" decoding="async" width="200" height="55">
          </div>
        </li>
      </ul>

      <p class="classical-note" data-i18n="home.classicalNote" data-i18n-html></p>

      <footer class="footer-dev">
        <details class="dev-details">
          <summary data-i18n="home.readme">Architecture</summary>
          <p><code>cargo run -p quantum-tetris</code></p>
          <p><code>QUANTUM_MODE=qiskit cargo run -p quantum-tetris</code></p>
        </details>
        <p>
          <a href="QUANTUM.md" data-i18n="home.circuitsLink">Référence circuits</a> ·
          <a href="https://github.com/thepriben/quantum-tetris" data-i18n="home.github">GitHub</a>
        </p>
      </footer>
    </section>
  </div>

  <script type="module">
    import { bootGame, bindLocaleSync } from './boot.js';

    const loader = document.getElementById('loader');
    const errorEl = document.getElementById('error');
    const frameInner = document.getElementById('frame-inner');

    bootGame({ frameInner, loader, errorEl }).catch((e) => {
      loader?.classList.add('hidden');
      errorEl.textContent = window.qtI18n?.t?.('error.wasm') ?? 'WASM error';
      errorEl.classList.add('visible');
      console.error(e);
    });

    bindLocaleSync((lang) => window.__qtSetWebLocale?.(lang));
  </script>
</body>
</html>
