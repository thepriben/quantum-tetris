<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quantum Tetris — Play</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0a1220; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      padding: 8px 12px; font: 13px system-ui, sans-serif;
      color: #bdf; background: rgba(8, 18, 32, 0.9); pointer-events: auto;
    }
    #bar a { color: #6fd; text-decoration: none; }
    #bar a:hover { text-decoration: underline; }
    #keys {
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    #keys.visible { display: flex; }
    .hint {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .hint kbd {
      display: inline-block;
      padding: 2px 5px;
      font: 600 10px/1.2 ui-monospace, monospace;
      color: #fc5;
      background: rgba(16, 28, 44, 0.95);
      border: 1px solid rgba(80, 130, 190, 0.7);
      border-radius: 4px;
    }
    .hint span {
      color: #cde;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    #status { color: #8cf; font-size: 12px; }
  </style>
</head>
<body>
  <div id="bar">
    <a href="index.html">← Home</a>
    <div id="keys">
      <div class="hint"><kbd>LR</kbd><span>MOVE</span></div>
      <div class="hint"><kbd>^</kbd><span>ROTATE</span></div>
      <div class="hint"><kbd>v</kbd><span>FASTER</span></div>
      <div class="hint"><kbd>Sp</kbd><span>DROP</span></div>
    </div>
    <span id="status">Loading…</span>
  </div>
  <script type="module">
    import init, { run_wasm } from './wasm/quantum_tetris.js';

    const status = document.getElementById('status');

    async function boot() {
      status.textContent = 'Starting quantum mode…';
      await init();
      run_wasm();
      document.getElementById('keys').classList.remove('visible');
      status.textContent = 'Quantum mode · switch CLASSIC / QUANTUM in-game';
    }

    boot().catch((e) => {
      status.textContent = 'WASM error — run ./scripts/build_wasm.sh first';
      console.error(e);
    });
  </script>
</body>
</html>
