<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quantum Tetris — Play</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0a1220; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      padding: 8px 12px; font: 14px system-ui, sans-serif;
      color: #bdf; background: rgba(8, 18, 32, 0.85); pointer-events: auto;
    }
    #bar a { color: #6fd; }
    #keys { color: #fc5; font-weight: 600; letter-spacing: 0.05em; }
    #status { color: #8cf; }
  </style>
</head>
<body>
  <div id="bar">
    <a href="index.html">← Home</a>
    <span id="keys">← → MOVE · ↑ ROTATE · ↓ FASTER · SPACE OBSERVE!</span>
    <span id="status">Loading…</span>
  </div>
  <script type="module">
    import init, { run_wasm } from './wasm/quantum_tetris.js';

    const status = document.getElementById('status');

    async function boot() {
      status.textContent = 'Starting quantum mode…';
      await init();
      run_wasm();
      status.textContent = 'Quantum · Born rule (Qiskit-matched) · use CLASSIC / QUANTUM in game';
    }

    boot().catch((e) => {
      status.textContent = 'WASM error — run ./scripts/build_wasm.sh first';
      console.error(e);
    });
  </script>
</body>
</html>
