<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quantum Tetris — Jouer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%; height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      color: #cde;
      background: #060a14;
    }
    body {
      display: flex; flex-direction: column;
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, rgba(30, 80, 140, 0.18), transparent 70%),
        radial-gradient(circle at 20% 80%, rgba(0, 120, 90, 0.08), transparent 45%),
        linear-gradient(180deg, #060a14 0%, #0a1220 50%, #060a14 100%);
    }

    header {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 1rem;
      padding: 0.65rem 1.25rem;
      border-bottom: 1px solid rgba(60, 100, 150, 0.25);
      background: rgba(8, 14, 26, 0.85);
      backdrop-filter: blur(8px);
    }
    .brand {
      font-weight: 800; font-size: 0.95rem; letter-spacing: 0.06em;
      color: #5ef; text-shadow: 0 0 14px rgba(80, 200, 255, 0.35);
    }
    header nav { display: flex; align-items: center; gap: 0.75rem; margin-left: auto; }
    header a {
      color: #8ec; text-decoration: none; font-size: 0.82rem; font-weight: 600;
      padding: 0.35rem 0.65rem; border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }
    header a:hover { color: #bff; background: rgba(40, 70, 110, 0.35); }
    #lang-toggle {
      padding: 0.35rem 0.7rem; font: 600 11px system-ui, sans-serif;
      color: #bdf; background: rgba(16, 28, 44, 0.95);
      border: 1px solid rgba(80, 130, 190, 0.55); border-radius: 6px; cursor: pointer;
    }
    #lang-toggle:hover { background: rgba(24, 40, 62, 0.98); }

    #stage {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 1.25rem 1rem 1.5rem;
      min-height: 0;
    }
    #frame {
      position: relative;
      padding: 3px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(60, 140, 220, 0.55), rgba(40, 200, 160, 0.35), rgba(80, 120, 200, 0.45));
      box-shadow:
        0 0 40px rgba(40, 120, 200, 0.2),
        0 12px 40px rgba(0, 0, 0, 0.45);
    }
    #frame-inner {
      border-radius: 11px;
      overflow: hidden;
      background: #0a1220;
      line-height: 0;
    }
    #frame canvas {
      display: block;
      width: min(900px, calc(100vw - 2.5rem)) !important;
      height: auto !important;
      max-height: calc(100vh - 7rem);
      aspect-ratio: 900 / 720;
      touch-action: none;
    }

    #loader {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1rem; min-width: 16rem; min-height: 10rem;
      color: #8cf; font-size: 0.9rem;
    }
    #loader.hidden { display: none; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(80, 140, 200, 0.25);
      border-top-color: #5ef;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #error {
      display: none; color: #f88; font-size: 0.85rem; text-align: center;
      max-width: 22rem; padding: 0.5rem;
    }
    #error.visible { display: block; }
  </style>
  <script src="i18n.js" defer></script>
</head>
<body data-page="play">
  <header>
    <span class="brand">Quantum Tetris</span>
    <nav>
      <a href="index.html" data-i18n="play.home">← Guide quantum</a>
      <button id="lang-toggle" type="button">(en)</button>
    </nav>
  </header>

  <main id="stage">
    <div id="frame">
      <div id="frame-inner">
        <div id="loader">
          <div class="spinner" aria-hidden="true"></div>
          <span id="loader-text" data-i18n="play.starting">Démarrage…</span>
        </div>
        <p id="error"></p>
      </div>
    </div>
  </main>

  <script type="module">
    import init, { run_wasm } from './wasm/quantum_tetris.js';

    const loader = document.getElementById('loader');
    const loaderText = document.getElementById('loader-text');
    const errorEl = document.getElementById('error');
    const frameInner = document.getElementById('frame-inner');

    function strings() {
      const en = window.qtI18n?.getLocale?.() === 'en';
      return en
        ? {
            starting: 'Loading quantum engine…',
            error: 'WASM error — run ./scripts/build_wasm.sh first',
          }
        : {
            starting: 'Chargement du moteur quantique…',
            error: 'Erreur WASM — lance ./scripts/build_wasm.sh',
          };
    }

    function mountCanvas() {
      const canvas = document.querySelector('canvas');
      if (!canvas) {
        requestAnimationFrame(mountCanvas);
        return;
      }
      loader.classList.add('hidden');
      frameInner.appendChild(canvas);
    }

    async function boot() {
      loaderText.textContent = strings().starting;
      await init();
      run_wasm();
      mountCanvas();
    }

    boot().catch((e) => {
      loader.classList.add('hidden');
      errorEl.textContent = strings().error;
      errorEl.classList.add('visible');
      console.error(e);
    });

    window.addEventListener('storage', (e) => {
      if (e.key === 'qt-lang' && !loader.classList.contains('hidden')) {
        loaderText.textContent = strings().starting;
      }
    });
    document.getElementById('lang-toggle')?.addEventListener('click', () => {
      setTimeout(() => {
        if (!loader.classList.contains('hidden')) {
          loaderText.textContent = strings().starting;
        }
      }, 0);
    });
  </script>
</body>
</html>
