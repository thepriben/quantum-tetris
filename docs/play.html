<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quantum Tetris — Jouer</title>
  <link rel="stylesheet" href="site.css">
  <style>
    html, body { height: 100%; }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.65rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel);
    }
    .brand {
      font-weight: 700;
      font-size: 0.92rem;
      letter-spacing: 0.04em;
      color: var(--heading);
    }
    header nav {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-left: auto;
    }
    header nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
    }
    header nav a:hover {
      color: var(--link-hover);
      text-decoration: underline;
    }

    #stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem 1rem 1.5rem;
      min-height: 0;
    }
    #frame {
      width: min(900px, calc(100vw - 2.5rem));
    }
    #frame canvas {
      max-height: calc(100vh - 7rem);
    }
  </style>
  <script src="i18n.js" defer></script>
</head>
<body data-page="play">
  <header>
    <span class="brand">Quantum Tetris</span>
    <nav>
      <a href="index.html" data-i18n="play.home">← Accueil</a>
      <div class="lang-flags" role="group" aria-label="Language">
        <button type="button" class="lang-btn" data-lang="fr" title="Français" aria-label="Français">🇫🇷</button>
        <button type="button" class="lang-btn" data-lang="en" title="English" aria-label="English">🇬🇧</button>
      </div>
    </nav>
  </header>

  <main id="stage">
    <div id="frame">
      <div id="frame-inner">
        <div id="loader">
          <div class="spinner" aria-hidden="true"></div>
          <span id="loader-text" data-i18n="play.starting">Démarrage…</span>
        </div>
        <p id="error"></p>
      </div>
    </div>
  </main>

  <script type="module">
    import init, { run_wasm } from './wasm/quantum_tetris.js';

    const loader = document.getElementById('loader');
    const loaderText = document.getElementById('loader-text');
    const errorEl = document.getElementById('error');
    const frameInner = document.getElementById('frame-inner');

    function strings() {
      const en = window.qtI18n?.getLocale?.() === 'en';
      return en
        ? {
            starting: 'Loading quantum engine…',
            error: 'WASM error — run ./scripts/build_wasm.sh first',
          }
        : {
            starting: 'Chargement du moteur quantique…',
            error: 'Erreur WASM — lance ./scripts/build_wasm.sh',
          };
    }

    function mountCanvas() {
      const canvas = document.querySelector('canvas');
      if (!canvas) {
        requestAnimationFrame(mountCanvas);
        return;
      }
      loader.classList.add('hidden');
      frameInner.appendChild(canvas);
    }

    async function boot() {
      loaderText.textContent = strings().starting;
      await init();
      run_wasm();
      mountCanvas();
    }

    boot().catch((e) => {
      loader.classList.add('hidden');
      errorEl.textContent = strings().error;
      errorEl.classList.add('visible');
      console.error(e);
    });

    window.addEventListener('storage', (e) => {
      if (e.key === 'qt-lang' && !loader.classList.contains('hidden')) {
        loaderText.textContent = strings().starting;
      }
    });
  </script>
</body>
</html>
