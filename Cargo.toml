[workspace]
resolver = "2"
members = [
    "crates/game",
    "crates/quantum",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["thepriben"]
repository = "https://github.com/thepriben/quantum-tetris"
rust-version = "1.89"

[workspace.dependencies]
bevy = { version = "0.18.1", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
